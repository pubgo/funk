syntax = "proto3";

package errors;

import "errorpb/code.proto";
import "google/protobuf/descriptor.proto";

option go_package = "github.com/pubgo/funk/v2/proto/errorpb;errorpb";

message Options {
  bool gen = 1;
  Code default_code = 2;
  string name = 3;
}

message Fields {
  Code code = 1;
  string msg = 2;
  string name = 3;
}

extend google.protobuf.EnumValueOptions {
  Fields field = 100002;
}

extend google.protobuf.EnumOptions {
  Options opts = 100001;
}
