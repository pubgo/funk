name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:
  release:
    name: Release on GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create cache directories
        run: mkdir -p ~/.cache/go-build

      - name: Go Mod Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-mod-cache-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-cache-${{ runner.os }}-

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install git-cliff
        run: |
          tmpdir="$(mktemp -d)"
          curl -sSL "https://github.com/orhun/git-cliff/releases/download/v2.10.1/git-cliff-2.10.1-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$tmpdir"
          install "$tmpdir"/git-cliff-2.10.1/git-cliff /usr/local/bin/git-cliff
          git-cliff --version

      - name: Generate changelog
        run: git cliff --latest --strip header --config cliff.toml > "${RUNNER_TEMP}/CHANGES.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.12.0
          args: release --clean --release-notes-file=${{ runner.temp }}/CHANGES.md
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASER_TOKEN }}
