checksum: da0042a7fd2f896b71347db71617fc0478e20452
vendor: proto-vendor
base:
  out: proto
  paths: source_relative
root:
  - proto
includes:
  - proto
deps:
  - name: google
    url: github.com/googleapis/googleapis
    path: /google
    version: v0.0.0-20220224004616-3c171936039b
  - name: google/protobuf
    url: /opt/homebrew/include/google/protobuf
    optional: true
plugins:
  - name: go
  - name: go-errors2
  - name: go-enum2
linter:
  rules:
    enabled_rules:
      - core::0131::http-method
      - core::0131::http-body
      - core::0235::plural-method-name
