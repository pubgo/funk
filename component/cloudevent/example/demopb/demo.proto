syntax = "proto3";

package demo.cloudevent.v1;

import "cloudeventoption/options.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/pubgo/funk/v2/component/cloudevent/example/demopb;demopb";

message HelloExecReq {
  string name = 1;
}

service DemoInnerService {
  option (lava.cloudevent.job) = {name: "demo"};

  rpc HelloExec(HelloExecReq) returns (google.protobuf.Empty) {
    option (lava.cloudevent.subject) = {name: "demo.hello.exec"};
  }
}
